<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#1f1f1f">
<meta name="color-scheme" content="dark light">

<title>Odmit</title>
<link rel="manifest" href="manifest.json">

<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">

<script>
/* Theme: Dark (default) / Light / System, saved per device. Applied before first paint. */
(function () {
  var pref; try { pref = JSON.parse(localStorage.getItem('odmit.theme')); } catch (e) {}
  if (pref !== 'light' && pref !== 'system') pref = 'dark';
  var mq = window.matchMedia ? matchMedia('(prefers-color-scheme: light)') : null;
  function apply() {
    var t = pref === 'system' ? (mq && mq.matches ? 'light' : 'dark') : pref;
    document.documentElement.setAttribute('data-theme', t);
    var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', t === 'dark' ? '#1f1f1f' : '#2564cf');
  }
  window.odmitTheme = { get: function () { return pref; }, set: function (p) { pref = p; try { localStorage.setItem('odmit.theme', JSON.stringify(p)); } catch (e) {} apply(); } };
  if (mq && mq.addEventListener) mq.addEventListener('change', function () { if (pref === 'system') apply(); });
  apply();
})();
</script>
<style>
:root{color-scheme:light;--blue:#2564cf;--blue-d:#1a4fa8;--blue-l:#eff6fc;--accent:#2564cf;--accent-h:#1a4fa8;--on-accent:#fff;--bg:#faf9f8;--side:#ffffff;--line:#edebe9;--txt:#323130;--sub:#605e5c;--red:#a4262c;--row:#fff;--row-h:#f5f5f5;--sel:#deecf9;--hover:#f3f2f1;--pane:#f3f2f1;--card:#fff;--card-h:#faf9f8;--menu:#fff;--modal:#fff;--field:#fff;--border2:#8a8886;--muted:#c8c6c4;--topbar:#2564cf;--topbar-txt:#fff;--search:#fff;--avatar:#c7e0f4;--avatar-txt:#1a4fa8;--toast:#323130;--toast-txt:#fff;--toast-link:#9fd5ff;--auth-bg:linear-gradient(160deg,#2564cf 0%,#5a8fe6 100%);--shadow:0 .3px .9px rgba(0,0,0,.1),0 1.6px 3.6px rgba(0,0,0,.13)}
/* Dark theme (default), modelled on Microsoft To Do dark: #1f1f1f / #292929 / #323232 surfaces */
html[data-theme="dark"]{color-scheme:dark;--blue:#6ea8fe;--blue-d:#9cc3ff;--blue-l:#1e2d45;--accent:#2564cf;--accent-h:#3a76dd;--on-accent:#fff;--bg:#1f1f1f;--side:#292929;--line:#3b3b3b;--txt:#f3f3f3;--sub:#b3b3b3;--red:#ff8a8a;--row:#292929;--row-h:#323232;--sel:#233a5e;--hover:#323232;--pane:#1f1f1f;--card:#292929;--card-h:#323232;--menu:#2d2d2d;--modal:#292929;--field:#1f1f1f;--border2:#6b6b6b;--muted:#5c5c5c;--topbar:#292929;--topbar-txt:#f3f3f3;--search:#3a3a3a;--avatar:#233a5e;--avatar-txt:#cfe1ff;--toast:#f3f3f3;--toast-txt:#1f1f1f;--toast-link:#1a4fa8;--auth-bg:linear-gradient(160deg,#1f1f1f 0%,#1b2b45 100%);--shadow:0 .3px .9px rgba(0,0,0,.45),0 1.6px 3.6px rgba(0,0,0,.5)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Segoe UI","Segoe UI Web",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--txt);font-size:14px;background:var(--bg);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
svg.solid{fill:currentColor;stroke:none}
.hidden{display:none!important}
#app{height:100%;display:flex;flex-direction:column}
#app>#shell{flex:1;min-height:0}
/* top bar */
#topbar{flex:none;height:48px;background:var(--topbar);color:var(--topbar-txt);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 8px 0 4px;position:relative;z-index:30;padding-top:env(safe-area-inset-top);box-sizing:content-box}
#topbar .brand{font-weight:600;font-size:16px;padding:0 8px;white-space:nowrap}
.tb-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:4px}
.tb-btn:hover{background:rgba(255,255,255,.15)}
#searchWrap{flex:1;max-width:400px;margin:0 auto;display:flex;align-items:center;background:var(--search);color:var(--txt);border-radius:4px;height:32px;padding:0 8px;gap:6px}
#searchWrap svg{color:var(--blue);width:18px}
#search{border:0;outline:0;flex:1;min-width:0;background:transparent}
#syncChip{font-size:12px;display:flex;align-items:center;gap:4px;opacity:.95;white-space:nowrap;padding:0 6px}
#syncChip .dot{width:8px;height:8px;border-radius:50%;background:#92c353}
#syncChip.off .dot{background:#ffaa44}#syncChip.err .dot{background:#ff6b6b}#syncChip.busy .dot{background:currentColor;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--avatar);color:var(--avatar-txt);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;flex:none}
.avatar.sm{width:24px;height:24px;font-size:10px}
#topbar .avatar{background:#fff;color:#1a4fa8}
#meAvatar{position:relative;cursor:pointer;border:0;padding:0;font:inherit;font-weight:600;font-size:12px}
#meAvatar .nbadge{position:absolute;top:-4px;right:-6px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#d13438;color:#fff;font-size:10px;font-weight:700;line-height:16px;text-align:center;box-shadow:0 0 0 2px var(--topbar);box-sizing:border-box}
/* notifications panel (tap your initials) */
.backdrop.np-back{align-items:flex-start;justify-content:flex-end;padding:56px 12px 12px;background:rgba(0,0,0,.25)}
.modal.npanel{max-width:400px;padding:0;display:flex;flex-direction:column;max-height:calc(100vh - 72px);overflow:hidden}
.np-acct{display:flex;align-items:center;gap:12px;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.np-acct .avatar{width:44px;height:44px;font-size:16px}
.np-acct .who{flex:1;min-width:0}.np-acct .who b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.np-acct .who small{color:var(--sub);font-size:12px}
.np-acct .acts{display:flex;gap:2px}
.np-icbtn{width:36px;height:36px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--sub)}
.np-icbtn:hover{background:var(--hover);color:var(--txt)}.np-icbtn svg{width:20px;height:20px}
.np-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 6px}
.np-head h2{margin:0;font-size:16px}
#npList{overflow:auto;padding:0 6px 8px;flex:1}
.np-item{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:10px;border-radius:6px;position:relative;color:var(--txt)}
.np-item:hover{background:var(--hover)}
.np-item.unread{background:var(--blue-l)}
.np-item.unread::after{content:'';position:absolute;right:10px;top:16px;width:8px;height:8px;border-radius:50%;background:var(--blue)}
.np-ic{flex:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--hover);color:var(--blue)}
.np-ic svg{width:18px;height:18px}.np-ic.done{color:#92c353}
.np-txt{flex:1;min-width:0;padding-right:14px;font-size:14px;line-height:1.35}
.np-txt .what{overflow-wrap:anywhere}
.np-meta{display:flex;align-items:center;gap:4px;color:var(--sub);font-size:12px;margin-top:3px;flex-wrap:wrap}
.np-meta .li{width:16px;height:16px}.np-meta .li svg{width:14px;height:14px}
.np-empty{text-align:center;color:var(--sub);padding:28px 16px 32px}
.np-empty svg{width:36px;height:36px;color:var(--muted);display:block;margin:0 auto 8px}
@media (max-width:767px){.backdrop.np-back{padding:calc(52px + env(safe-area-inset-top)) 8px 8px}.modal.npanel{max-width:none;max-height:calc(100vh - 64px - env(safe-area-inset-top))}}
/* layout */
#shell{display:flex}
#sidebar{width:290px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;flex:none;transition:transform .2s}
#navScroll{flex:1;overflow-y:auto;padding:8px 0}
.nav-item{display:flex;align-items:center;gap:14px;padding:0 16px 0 20px;height:40px;cursor:pointer;position:relative;user-select:none;-webkit-user-select:none}
.nav-item:hover{background:var(--hover)}
.nav-item.active{background:var(--sel);font-weight:600}
.nav-item.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--blue);border-radius:2px}
.nav-item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .count{font-size:12px;color:var(--sub);font-weight:400}
.nav-item svg{color:var(--blue)}
.nav-item .shared-ic{color:var(--sub);width:16px}
.nav-sep{height:1px;background:var(--line);margin:8px 16px}
.nav-group{display:flex;align-items:center;gap:10px;padding:0 16px 0 20px;height:36px;cursor:pointer;color:var(--sub);font-weight:600;user-select:none}
.nav-group:hover{background:var(--hover)}
.nav-group .chev{width:14px;transition:transform .15s}
.nav-group.collapsed .chev{transform:rotate(-90deg)}
.nav-group .name{flex:1}
.nav-group-items .nav-item{padding-left:36px}
.drop-before{box-shadow:inset 0 2px 0 var(--blue)}
.drop-into{background:var(--sel)!important;outline:2px solid var(--blue);outline-offset:-2px}
#navFooter{display:flex;border-top:1px solid var(--line);height:48px;align-items:center}
#navFooter button{display:flex;align-items:center;gap:12px;color:var(--blue);padding:0 20px;height:100%;flex:1;text-align:left}
#navFooter button:hover{background:var(--hover)}
#navFooter .ng{flex:none;padding:0 14px}
#main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
#mainHead{padding:16px 24px 8px;display:flex;align-items:flex-start;gap:8px}
#mainHead .titles{flex:1;min-width:0}
#viewTitle{font-size:20px;font-weight:600;color:var(--blue);border:0;background:transparent;outline:0;width:100%;padding:2px 4px;margin-left:-4px;border-radius:4px;text-overflow:ellipsis}
#viewTitle:not([readonly]):hover{background:var(--row)}
#viewTitle:not([readonly]):focus{background:var(--row);box-shadow:0 0 0 1px var(--line)}
#viewSub{font-size:12px;color:var(--sub);margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--row);border:1px solid var(--line);border-radius:12px;padding:1px 8px;font-size:12px;color:var(--sub)}
.chip svg{width:14px}
.head-btn{display:flex;align-items:center;gap:6px;height:32px;padding:0 8px;border-radius:4px;color:var(--sub);white-space:nowrap}
.head-btn:hover{background:var(--row);color:var(--blue)}
.head-btn svg{width:18px}
#menuBtn{display:none}
#addBox{margin:4px 24px 8px;background:var(--row);box-shadow:var(--shadow);border-radius:4px;display:flex;align-items:center;gap:12px;padding:0 12px;height:52px}
#addBox svg{color:var(--blue)}
#addInput{border:0;outline:0;flex:1;min-width:0;background:transparent;font-size:14px}
#addInput::placeholder{color:var(--blue)}
#addInput:focus::placeholder{color:var(--sub)}
#addBtn{color:var(--blue);font-weight:600;padding:6px 10px;border-radius:4px}
#addBtn:hover{background:var(--blue-l)}
#taskArea{flex:1;overflow-y:auto;padding:0 24px 80px}
.sec-head{display:flex;align-items:center;gap:8px;margin:14px 0 6px;font-weight:600;cursor:pointer;user-select:none;font-size:14px}
.sec-head .chev{width:16px;transition:transform .15s}
.sec-head.collapsed .chev{transform:rotate(-90deg)}
.sec-head .cnt{color:var(--sub);font-weight:400}
.sec-head.overdue{color:var(--red)}
/* search results: Groups -> Lists -> Tasks */
mark{background:#fff1a8;color:inherit;border-radius:2px;padding:0 1px}
html[data-theme="dark"] mark{background:rgba(255,214,0,.3);color:#fff}
.sr-sec{display:flex;align-items:center;gap:8px;margin:18px 2px 8px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--sub)}
.sr-sec:first-child{margin-top:4px}.sr-sec .cnt{font-weight:400}
.sr-group{margin-bottom:14px}
.sr-ghead{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:8px;border-radius:10px;cursor:pointer;font-weight:600;font-size:15px;color:var(--txt);background:var(--card)}
.sr-ghead:hover{background:var(--card-h)}.sr-ghead>svg:first-child{width:20px;height:20px;color:var(--blue)}
.sr-ghead .name,.sr-head .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-ghead .cnt,.sr-head .cnt{color:var(--sub);font-weight:400;font-size:13px}
.sr-ghead>svg:last-child,.sr-head>svg:last-child{width:16px;height:16px;color:var(--sub)}
.sr-group .sr-list{margin-left:14px}
.sr-head{display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:44px;cursor:pointer;font-weight:600;font-size:14px;border-bottom:1px solid var(--line)}
.sr-head:hover{background:var(--row-h)}.sr-head .li{width:20px;height:20px}.sr-head .li svg{width:18px;height:18px}
.sr-head .shared-ic svg{width:14px;height:14px;color:var(--sub)}
.sr-list .sec-head.sr-done{margin:0;padding:10px 14px;font-size:13px;border-top:1px solid var(--line)}
.sr-none{padding:12px 14px;color:var(--sub);font-size:13px}
.task .meta .li{width:14px;height:14px;display:inline-flex}.task .meta .li svg{width:13px;height:13px}.task .meta .li .emo{font-size:12px}
.nav-group.active{color:var(--blue)}
.task{display:flex;align-items:center;gap:12px;background:var(--row);box-shadow:var(--shadow);border-radius:4px;min-height:52px;padding:6px 12px;margin-bottom:2px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.task:hover{background:var(--row-h)}
.task.selected{background:var(--sel)}
.task .body{flex:1;min-width:0}
.task .title{overflow:hidden;text-overflow:ellipsis;word-break:break-word}
.task.done .title{text-decoration:line-through;color:var(--sub)}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--sub);margin-top:2px;align-items:center}
.meta span{display:inline-flex;align-items:center;gap:3px}
.meta svg{width:13px;height:13px}
.meta .od{color:var(--red)}.meta .td{color:var(--blue)}
.circle{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--blue);display:flex;align-items:center;justify-content:center;flex:none;color:var(--blue)}
.circle svg{width:14px;height:14px;stroke-width:2.2;opacity:0}
.circle svg.solid{display:none}
.circle:hover svg{opacity:.7}
.circle.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}.circle.on svg{display:none}.circle.on svg.solid{display:block;opacity:1}
.star{color:var(--blue);display:flex;padding:4px}
.star svg.solid{display:none}.star.on svg{display:none}.star.on svg.solid{display:block}
.empty{text-align:center;color:var(--sub);margin-top:60px}
.empty svg{width:64px;height:64px;color:var(--muted);stroke-width:1}
/* detail pane */
#detail{width:360px;background:var(--pane);border-left:1px solid var(--line);display:flex;flex-direction:column;flex:none}
#detailScroll{flex:1;overflow-y:auto;padding:12px 16px 16px}
.d-card{background:var(--card);border-radius:4px;border:1px solid var(--line);margin-bottom:8px}
.d-title{display:flex;align-items:flex-start;gap:12px;padding:14px 12px 8px}
.d-title .circle{margin-top:4px}
#dTitle{flex:1;border:0;outline:0;resize:none;font-size:18px;font-weight:600;background:transparent;min-height:28px;overflow:hidden;padding:0;line-height:1.4}
.d-title .star{margin-top:2px}
.step{display:flex;align-items:center;gap:12px;padding:6px 12px;border-top:1px solid transparent}
.step .circle{width:16px;height:16px}.step .circle svg{width:11px;height:11px}
.step input{flex:1;border:0;outline:0;background:transparent;padding:4px 0;min-width:0}
.step.done input{text-decoration:line-through;color:var(--sub)}
.step .x{opacity:.0;color:var(--sub)}.step:hover .x{opacity:1}
.add-step{display:flex;align-items:center;gap:12px;padding:8px 12px 12px;color:var(--blue)}
.add-step input{flex:1;border:0;outline:0;background:transparent;min-width:0}
.add-step input::placeholder{color:var(--blue)}
.d-row{display:flex;align-items:center;gap:14px;padding:0 12px;min-height:50px;cursor:pointer;color:var(--sub);position:relative}
.d-row+.d-row{border-top:1px solid var(--line)}
.d-row:hover{background:var(--card-h)}
.d-row .lbl{flex:1;min-width:0}
.d-row .lbl small{display:block;font-size:12px}
.d-row.set{color:var(--blue)}.d-row.set.od{color:var(--red)}
.d-row .clr{display:none;color:var(--sub);padding:6px}.d-row.set .clr{display:flex}
.d-row select{flex:1;border:0;background:transparent;outline:0;color:inherit;min-width:0;cursor:pointer}
#dNotes{width:100%;border:0;outline:0;resize:vertical;min-height:110px;padding:12px;background:transparent;border-radius:4px}
#detailFoot{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;border-top:1px solid var(--line);color:var(--sub);font-size:12px}
#detailFoot .center{flex:1;text-align:center}
/* menus, modals, toasts */
.menu{position:fixed;z-index:100;background:var(--menu);border:1px solid var(--line);box-shadow:0 6.4px 14.4px rgba(0,0,0,.28),0 1.2px 3.6px rgba(0,0,0,.2);border-radius:4px;min-width:220px;padding:6px 0;max-height:80vh;overflow:auto}
.menu .mi{display:flex;align-items:center;gap:12px;width:100%;padding:0 16px;height:36px;text-align:left}
.menu .mi:hover{background:var(--hover)}
.menu .mi.danger{color:var(--red)}
.menu .mi .r{margin-left:auto;color:var(--sub);font-size:12px}
.menu .msep{height:1px;background:var(--line);margin:4px 0}
.menu .mhead{padding:6px 16px;font-size:12px;color:var(--sub);font-weight:600}
.menu .mform{padding:8px 16px;display:flex;flex-direction:column;gap:8px}
.menu .mform input,.menu .mform select{padding:6px;border:1px solid var(--border2);border-radius:2px;background:var(--field);color:var(--txt)}
.menu .days{display:flex;gap:4px}.menu .days label{display:flex;flex-direction:column;align-items:center;font-size:11px}
#overlay{position:fixed;inset:0;z-index:90}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--modal);border:1px solid var(--line);border-radius:8px;box-shadow:0 25px 50px rgba(0,0,0,.25);width:100%;max-width:440px;max-height:90vh;overflow:auto;padding:22px 24px}
.modal h2{margin:0 0 6px;font-size:18px;font-weight:600}
.modal p{color:var(--sub);margin:4px 0 14px;line-height:1.45}
.modal .row-end{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.btn{height:32px;padding:0 16px;border-radius:4px;border:1px solid var(--border2);background:var(--card);font-weight:600}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}.btn.primary:hover{background:var(--accent-h);border-color:var(--accent-h)}
.btn.danger{background:#a4262c;border-color:#a4262c;color:#fff}
.btn.link{border:0;color:var(--blue);padding:0 4px;font-weight:400}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:13px;font-weight:600}
.field input,.field select{height:34px;padding:0 10px;border:1px solid var(--border2);border-radius:4px;outline:0;background:var(--field);color:var(--txt)}
.field input:focus{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.share-user{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.share-user input{width:18px;height:18px;accent-color:var(--blue);margin:0}
.share-user .nm{flex:1}
.share-user .tag{font-size:12px;color:var(--sub)}
.code{font-family:Consolas,monospace;font-size:18px;letter-spacing:2px;background:var(--blue-l);padding:6px 10px;border-radius:4px;display:inline-block;color:var(--blue-d)}
table.users{width:100%;border-collapse:collapse;font-size:13px}table.users td{padding:6px 4px;border-bottom:1px solid var(--line)}
.settings-sec{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}
.settings-sec h3{font-size:14px;margin:0 0 8px}
.seg{display:inline-flex;border:1px solid var(--border2);border-radius:4px;overflow:hidden}.seg button{display:flex;align-items:center;gap:6px;height:32px;padding:0 14px;font-weight:600}.seg button+button{border-left:1px solid var(--border2)}.seg button svg{width:16px}.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:var(--toast);color:var(--toast-txt);padding:10px 16px;border-radius:4px;box-shadow:var(--shadow);pointer-events:auto;display:flex;gap:12px;align-items:center}
.toast button{color:var(--toast-link);font-weight:600}
.toast.reminder{background:var(--accent);color:#fff}.toast.reminder button{color:#fff;text-decoration:underline}
.drag-ghost{position:fixed;z-index:200;pointer-events:none;opacity:.9;box-shadow:0 8px 20px rgba(0,0,0,.25);transform:rotate(1deg);background:var(--row)!important;border-radius:10px!important}
.task.dragging{opacity:.35}
/* auth */
#auth{position:fixed;inset:0;background:var(--auth-bg);display:flex;align-items:center;justify-content:center;padding:16px;z-index:70;overflow:auto}
#auth .modal{max-width:380px}
#auth .logo{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:22px;font-weight:600;color:var(--blue)}
#auth .logo img{width:40px;height:40px}
#auth .err{color:var(--red);min-height:18px;font-size:13px;margin:4px 0}
#auth .alt{margin-top:14px;font-size:13px;display:flex;flex-direction:column;gap:6px}
#scrim{display:none}
/* ---- v2 look (after the Microsoft To Do dark references): rounded drawer rows, card groups, FAB */
.nav-item{margin:1px 8px;padding:0 10px 0 12px;border-radius:10px;height:42px;gap:12px}
.nav-item.active{background:var(--sel)}
.nav-item.active::before{display:none}
.nav-group{margin:0 8px;border-radius:10px;padding:0 10px 0 12px}
.nav-group-items .nav-item{padding-left:26px}
.li{display:flex;align-items:center;justify-content:center;width:22px;height:22px;flex:none;color:var(--blue)}
.nav-item .li svg,.li svg{width:20px;height:20px;color:inherit}
.li.tinted{color:var(--lc)}
.emo{font-size:18px;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;filter:none;color:initial}
.nav-tags .chevr{width:16px;height:16px;color:var(--sub);transition:transform .15s}
.nav-tags.open .chevr{transform:rotate(90deg)}
.nav-item.tag-item{padding-left:26px;height:38px}
.nav-item.sub-act{color:var(--blue);padding-left:26px;height:38px}
.nav-item.sub-act svg{width:18px}
#navFooter{border-top:1px solid var(--line);padding:6px 8px;height:auto}
#navFooter button{border-radius:10px;height:42px;padding:0 12px;font-weight:600}
#navFooter .ng{padding:0 12px}
.trow{display:flex;align-items:center;gap:8px}
#viewIcon:empty{display:none}
#viewIcon .li{width:26px;height:26px}#viewIcon .li svg{width:24px;height:24px}#viewIcon .emo{font-size:22px}
#main.tinted,#detail.tinted{--blue:var(--lc);--accent:var(--lc);--accent-h:var(--lc);--on-accent:var(--lc-on)}
html[data-theme="light"] #main.tinted,html[data-theme="light"] #detail.tinted{--blue:color-mix(in srgb,var(--lc) 62%,#000);--accent:color-mix(in srgb,var(--lc) 62%,#000);--accent-h:color-mix(in srgb,var(--lc) 55%,#000);--on-accent:#fff}
.tcard{background:var(--row);border-radius:12px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.tcard .task{box-shadow:none;border-radius:0;margin:0;background:transparent}
.tcard .task:hover{background:var(--row-h)}
.tcard .task.selected{background:var(--sel)}
.tcard .task+.task{border-top:1px solid var(--line)}
.tcard.sec .sec-head{margin:0;padding:12px 14px;min-height:44px}
.tcard.sec .sec-head.collapsed{padding-bottom:12px}
.task .right{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none;font-size:12px;color:var(--sub);min-width:0}
.task .due{color:var(--blue);font-weight:600;white-space:nowrap}
.task .due.od{color:var(--red)}
.task.done .due{color:var(--sub);font-weight:400}
.task .ind{display:flex;gap:4px;color:var(--sub)}
.task .ind svg{width:13px;height:13px}
.task .ind .rep{color:var(--blue)}
.tchip{display:inline-flex;align-items:center;gap:2px;border-radius:10px;padding:0 7px;font-size:11px;line-height:18px;color:var(--tc,var(--blue));background:color-mix(in srgb,var(--tc,var(--blue)) 16%,transparent);font-weight:600}
.tchip button{display:flex;color:inherit;opacity:.8}.tchip button svg{width:12px;height:12px}
html[data-theme="light"] .tchip{color:color-mix(in srgb,var(--tc,var(--blue)) 62%,#000)}
#dTags .lbl{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0}
#fab{display:none}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--blue-l);color:var(--txt);border-radius:12px;padding:12px 14px;margin:4px 0 12px;font-size:13px;line-height:1.45}
.banner svg{color:var(--blue);flex:none;margin-top:1px}
.banner.warn{background:color-mix(in srgb,#ffb020 16%,var(--row));}
.banner.warn svg{color:#ffb020}
.banner .x{margin-left:auto;color:var(--sub);display:flex}
.menu .mi .li{width:20px;height:20px}
.menu .mi .li svg{width:18px;height:18px}
/* list icon & color picker */
.modal.wide{max-width:560px}
.ls-top{display:flex;align-items:center;gap:12px;margin:10px 0 14px}
.ls-prev{width:44px;height:44px;border-radius:12px;background:var(--field);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.ls-prev .li{width:28px;height:28px}.ls-prev .li svg{width:26px;height:26px}.ls-prev .emo{font-size:26px}
.ls-top input{flex:1;height:40px;padding:0 12px;border:1px solid var(--border2);border-radius:8px;background:var(--field);color:var(--txt);outline:0;font-size:15px;font-weight:600}
.ls-top input:focus{border-color:var(--blue)}
.ls-label{font-size:12px;font-weight:600;color:var(--sub);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatch{width:28px;height:28px;border-radius:50%;background:var(--sw);border:2px solid transparent;position:relative;flex:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#1f1f1f}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--modal),0 0 0 4px var(--txt)}
.swatch.none{background:transparent;border:2px dashed var(--border2);color:var(--sub)}.swatch.none svg{width:14px}
.swatch.custom{background:conic-gradient(#ff6b6b,#fbbf24,#a3e635,#22d3ee,#818cf8,#e879f9,#ff6b6b)}
.swatch.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:14px}
.tabs [role=tab]{display:flex;align-items:center;gap:6px;padding:8px 12px;font-weight:600;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs [role=tab] svg{width:18px}
.tabs [role=tab][aria-selected="true"]{color:var(--blue);border-bottom-color:var(--blue)}
.tabs .btn.link{margin-left:auto}
.ls-tools{display:flex;gap:8px;margin:10px 0 8px;align-items:center;flex-wrap:wrap}
.ls-tools input{flex:1;min-width:140px;height:34px;padding:0 10px;border:1px solid var(--border2);border-radius:8px;background:var(--field);color:var(--txt);outline:0}
.ls-tools input:focus{border-color:var(--blue)}
.ls-tools .seg button{height:30px;padding:0 10px}
.ls-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:4px;max-height:248px;overflow-y:auto;padding:2px;align-content:start}
.ls-grid button{height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--lc,var(--blue))}
.ls-grid button:hover{background:var(--hover)}
.ls-grid button[aria-pressed="true"]{background:var(--sel);box-shadow:inset 0 0 0 2px var(--blue)}
.ls-grid button svg{width:22px;height:22px}
.ls-grid .emo{font-size:22px}
.ls-grid .gh{grid-column:1/-1;font-size:12px;font-weight:600;color:var(--sub);padding:8px 2px 2px;position:sticky;top:0;background:var(--modal);z-index:1}
.ls-grid .msg{grid-column:1/-1;color:var(--sub);padding:16px 4px;text-align:center}
.ls-cats{display:flex;gap:2px;flex-wrap:wrap}
.ls-cats button{padding:4px 6px;border-radius:6px;font-size:16px;line-height:1}
.ls-cats button:hover{background:var(--hover)}
.ls-hint{font-size:12px;color:var(--sub);margin-top:6px;min-height:16px}
/* mobile */
@media (max-width:767px){
  #menuBtn{display:flex}
  #topbar .brand{padding:0 2px}
  #searchWrap{max-width:none}
  #syncChip .txt{display:none}
  #sidebar{position:fixed;top:calc(48px + env(safe-area-inset-top));bottom:0;left:0;z-index:40;transform:translateX(-100%);width:min(300px,85vw)}
  body.nav-open #sidebar{transform:none;box-shadow:0 0 20px rgba(0,0,0,.2)}
  body.nav-open #scrim{display:block;position:fixed;inset:0;top:48px;background:rgba(0,0,0,.35);z-index:35}
  #detail{position:fixed;inset:0;top:calc(48px + env(safe-area-inset-top));width:auto;z-index:45;transform:translateX(100%);transition:transform .2s;border:0}
  body.detail-open #detail{transform:none}
  #mainHead{padding:12px 12px 6px}
  #addBox{margin:4px 12px 8px}
  #taskArea{padding:0 12px 90px}
  .head-btn .t{display:none}
  .step .x{opacity:1}
  #detailScroll{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  #fab{display:flex;position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--on-accent);align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.4);z-index:30}
  #fab svg{width:26px;height:26px;stroke-width:2}
  body.detail-open #fab,body.nav-open #fab{display:none}
  .ls-grid{max-height:34vh}
}
@media (min-width:768px){ #detail.closed{display:none} #detailBack{display:none} }

/* ---------- dates ---------- */
const pad2 = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const today = () => ymd(new Date());
const tomorrow = () => ymd(addDays(new Date(), 1));
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
function dueLabel(s) {
  if (!s) return '';
  const t = today();
  if (s === t) return 'Today';
  if (s === tomorrow()) return 'Tomorrow';
  if (s === ymd(addDays(new Date(), -1))) return 'Yesterday';
  const d = parseYmd(s), now = new Date();
  return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: d.getFullYear() !== now.getFullYear() ? 'numeric' : undefined });
}

  const day = ymd(d) === today() ? 'Today' : ymd(d) === tomorrow() ? 'Tomorrow' : d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  return day + ' ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}
function addMonths(d, n) {
  const x = new Date(d.getFullYear(), d.getMonth() + n, 1);

  return x;
}

  const d = parseYmd(s || today());

    case 'daily': return ymd(addDays(d, 1));
    case 'weekdays': { let x = addDays(d, 1); while (x.getDay() === 0 || x.getDay() === 6) x = addDays(x, 1); return ymd(x); }
    case 'weekly': return ymd(addDays(d, 7));
    case 'monthly': return ymd(addMonths(d, 1));
    case 'yearly': return ymd(addMonths(d, 12));
    case 'custom': {
      const n = r.interval || 1;
      if (r.unit === 'day') return ymd(addDays(d, n));
      if (r.unit === 'month') return ymd(addMonths(d, n));
      if (r.unit === 'year') return ymd(addMonths(d, 12 * n));
      if (r.days && r.days.length) {
        const w0 = startOfWeek(d).getTime();
        for (let i = 1; i < 7 * n + 8; i++) {
          const x = addDays(d, i), wk = Math.round((startOfWeek(x).getTime() - w0) / (7 * 864e5));
          if (r.days.includes(x.getDay()) && wk % n === 0) return ymd(x);
        }
      }
      return ymd(addDays(d, 7 * n));
    }
  }
  return ymd(addDays(d, 1));
}

  if (!r) return '';

  const u = r.interval === 1 ? r.unit : r.interval + ' ' + r.unit + 's';
  return 'Every ' + u + (r.unit === 'week' && r.days && r.days.length ? ' · ' + r.days.map(d => DOW[d]).join(', ') : '');

/* ---------- API transport ---------- */
function rawApi(body) {
  if (IN_GAS) return new Promise((res, rej) => google.script.run.withSuccessHandler(t => res(JSON.parse(t))).withFailureHandler(e => rej(e)).api(JSON.stringify(body)));
  const url = apiUrl();
  if (!url) return Promise.reject(new Error('NO_URL'));
  // text/plain = "simple" request: no CORS preflight (Apps Script can't answer OPTIONS)
  return fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), redirect: 'follow' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
}

  if (!('Notification' in window) || Notification.permission !== 'granted') return;

  if (!expired && session) { LS.del('server.' + session.userId); LS.del('queue.' + session.userId); LS.del('notified'); }
  session = null; server = null; st = null; queue = []; LS.del('session'); ui.selected = null;
  authCard('login', expired ? 'Please sign in again.' : '');
}
function showApp() {
  $('#auth').classList.add('hidden'); $('#app').classList.remove('hidden');
  if (qs.get('view')) ui.view = qs.get('view');
  render(); checkReminders();
  if (qs.get('task') || qs.get('list')) openTask(qs.get('task'), qs.get('list'));
  setTimeout(refreshPush, 2500);
}
async function start() {
  if (session) { loadLocal(); showApp(); flush(); return; }
  if (!IN_GAS && !apiUrl()) return authCard('url');
  try { const r = await rawApi({ action: 'status' }); authCard(r.needsSetup ? 'setup' : 'login'); }
  catch (e) { authCard((IN_GAS || DEFAULT_API_URL) ? 'login' : 'url', "Can't reach the server. Check your connection and try again."); }
}
if ('serviceWorker' in navigator && !IN_GAS && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
start();
</script>
