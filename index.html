<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2564cf">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Odmit</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--blue:#2564cf;--blue-d:#1a4fa8;--blue-l:#eff6fc;--bg:#faf9f8;--side:#ffffff;--line:#edebe9;--txt:#323130;--sub:#605e5c;--red:#a4262c;--row:#fff;--sel:#deecf9;--shadow:0 .3px .9px rgba(0,0,0,.1),0 1.6px 3.6px rgba(0,0,0,.13)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Segoe UI","Segoe UI Web",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--txt);font-size:14px;background:var(--bg);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:inherit}
svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.hidden{display:none!important}
#app{height:100%;display:flex;flex-direction:column}
#app>#shell{flex:1;min-height:0}
/* top bar */
#topbar{flex:none;height:48px;background:var(--blue);color:#fff;display:flex;align-items:center;gap:8px;padding:0 8px 0 4px;position:relative;z-index:30;padding-top:env(safe-area-inset-top);box-sizing:content-box}
#topbar .brand{font-weight:600;font-size:16px;padding:0 8px;white-space:nowrap}
.tb-btn{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:4px}
.tb-btn:hover{background:rgba(255,255,255,.15)}
#searchWrap{flex:1;max-width:400px;margin:0 auto;display:flex;align-items:center;background:#fff;color:var(--txt);border-radius:4px;height:32px;padding:0 8px;gap:6px}
#searchWrap svg{color:var(--blue);width:18px}
#search{border:0;outline:0;flex:1;min-width:0;background:transparent}
#syncChip{font-size:12px;display:flex;align-items:center;gap:4px;opacity:.95;white-space:nowrap;padding:0 6px}
#syncChip .dot{width:8px;height:8px;border-radius:50%;background:#92c353}
#syncChip.off .dot{background:#ffaa44}#syncChip.err .dot{background:#ff6b6b}#syncChip.busy .dot{background:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.avatar{width:32px;height:32px;border-radius:50%;background:#c7e0f4;color:var(--blue-d);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;flex:none}
.avatar.sm{width:24px;height:24px;font-size:10px}
#topbar .avatar{background:#fff}
/* layout */
#shell{display:flex}
#sidebar{width:290px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;flex:none;transition:transform .2s}
#navScroll{flex:1;overflow-y:auto;padding:8px 0}
.nav-item{display:flex;align-items:center;gap:14px;padding:0 16px 0 20px;height:40px;cursor:pointer;position:relative;user-select:none;-webkit-user-select:none}
.nav-item:hover{background:#f3f2f1}
.nav-item.active{background:var(--sel);font-weight:600}
.nav-item.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--blue);border-radius:2px}
.nav-item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .count{font-size:12px;color:var(--sub);font-weight:400}
.nav-item svg{color:var(--blue)}
.nav-item .shared-ic{color:var(--sub);width:16px}
.nav-sep{height:1px;background:var(--line);margin:8px 16px}
.nav-group{display:flex;align-items:center;gap:10px;padding:0 16px 0 20px;height:36px;cursor:pointer;color:var(--sub);font-weight:600;user-select:none}
.nav-group:hover{background:#f3f2f1}
.nav-group .chev{width:14px;transition:transform .15s}
.nav-group.collapsed .chev{transform:rotate(-90deg)}
.nav-group .name{flex:1}
.nav-group-items .nav-item{padding-left:36px}
.drop-before{box-shadow:inset 0 2px 0 var(--blue)}
.drop-into{background:var(--sel)!important;outline:2px solid var(--blue);outline-offset:-2px}
#navFooter{display:flex;border-top:1px solid var(--line);height:48px;align-items:center}
#navFooter button{display:flex;align-items:center;gap:12px;color:var(--blue);padding:0 20px;height:100%;flex:1;text-align:left}
#navFooter button:hover{background:#f3f2f1}
#navFooter .ng{flex:none;padding:0 14px}
#main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
#mainHead{padding:16px 24px 8px;display:flex;align-items:flex-start;gap:8px}
#mainHead .titles{flex:1;min-width:0}
#viewTitle{font-size:20px;font-weight:600;color:var(--blue);border:0;background:transparent;outline:0;width:100%;padding:2px 4px;margin-left:-4px;border-radius:4px;text-overflow:ellipsis}
#viewTitle:not([readonly]):hover{background:#fff}
#viewTitle:not([readonly]):focus{background:#fff;box-shadow:0 0 0 1px var(--line)}
#viewSub{font-size:12px;color:var(--sub);margin-top:2px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:1px 8px;font-size:12px;color:var(--sub)}
.chip svg{width:14px}
.head-btn{display:flex;align-items:center;gap:6px;height:32px;padding:0 8px;border-radius:4px;color:var(--sub);white-space:nowrap}
.head-btn:hover{background:#fff;color:var(--blue)}
.head-btn svg{width:18px}
#menuBtn{display:none}
#addBox{margin:4px 24px 8px;background:#fff;box-shadow:var(--shadow);border-radius:4px;display:flex;align-items:center;gap:12px;padding:0 12px;height:52px}
#addBox svg{color:var(--blue)}
#addInput{border:0;outline:0;flex:1;min-width:0;background:transparent;font-size:14px}
#addInput::placeholder{color:var(--blue)}
#addInput:focus::placeholder{color:var(--sub)}
#addBtn{color:var(--blue);font-weight:600;padding:6px 10px;border-radius:4px}
#addBtn:hover{background:var(--blue-l)}
#taskArea{flex:1;overflow-y:auto;padding:0 24px 80px}
.sec-head{display:flex;align-items:center;gap:8px;margin:14px 0 6px;font-weight:600;cursor:pointer;user-select:none;font-size:14px}
.sec-head .chev{width:16px;transition:transform .15s}
.sec-head.collapsed .chev{transform:rotate(-90deg)}
.sec-head .cnt{color:var(--sub);font-weight:400}
.sec-head.overdue{color:var(--red)}
.task{display:flex;align-items:center;gap:12px;background:var(--row);box-shadow:var(--shadow);border-radius:4px;min-height:52px;padding:6px 12px;margin-bottom:2px;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.task:hover{background:#f5f5f5}
.task.selected{background:var(--sel)}
.task .body{flex:1;min-width:0}
.task .title{overflow:hidden;text-overflow:ellipsis;word-break:break-word}
.task.done .title{text-decoration:line-through;color:var(--sub)}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--sub);margin-top:2px;align-items:center}
.meta span{display:inline-flex;align-items:center;gap:3px}
.meta svg{width:13px;height:13px}
.meta .od{color:var(--red)}.meta .td{color:var(--blue)}
.circle{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--blue);display:flex;align-items:center;justify-content:center;flex:none;color:var(--blue)}
.circle svg{width:12px;height:12px;stroke-width:2.6;opacity:0}
.circle:hover svg{opacity:.7}
.circle.on{background:var(--blue);color:#fff}.circle.on svg{opacity:1}
.star{color:var(--blue);display:flex;padding:4px}
.star.on svg{fill:var(--blue)}
.empty{text-align:center;color:var(--sub);margin-top:60px}
.empty svg{width:64px;height:64px;color:#c8c6c4;stroke-width:1}
/* detail pane */
#detail{width:360px;background:#f3f2f1;border-left:1px solid var(--line);display:flex;flex-direction:column;flex:none}
#detailScroll{flex:1;overflow-y:auto;padding:12px 16px 16px}
.d-card{background:#fff;border-radius:4px;border:1px solid var(--line);margin-bottom:8px}
.d-title{display:flex;align-items:flex-start;gap:12px;padding:14px 12px 8px}
.d-title .circle{margin-top:4px}
#dTitle{flex:1;border:0;outline:0;resize:none;font-size:18px;font-weight:600;background:transparent;min-height:28px;overflow:hidden;padding:0;line-height:1.4}
.d-title .star{margin-top:2px}
.step{display:flex;align-items:center;gap:12px;padding:6px 12px;border-top:1px solid transparent}
.step .circle{width:16px;height:16px}.step .circle svg{width:10px;height:10px}
.step input{flex:1;border:0;outline:0;background:transparent;padding:4px 0;min-width:0}
.step.done input{text-decoration:line-through;color:var(--sub)}
.step .x{opacity:.0;color:var(--sub)}.step:hover .x{opacity:1}
.add-step{display:flex;align-items:center;gap:12px;padding:8px 12px 12px;color:var(--blue)}
.add-step input{flex:1;border:0;outline:0;background:transparent;min-width:0}
.add-step input::placeholder{color:var(--blue)}
.d-row{display:flex;align-items:center;gap:14px;padding:0 12px;min-height:50px;cursor:pointer;color:var(--sub);position:relative}
.d-row+.d-row{border-top:1px solid var(--line)}
.d-row:hover{background:#faf9f8}
.d-row .lbl{flex:1;min-width:0}
.d-row .lbl small{display:block;font-size:12px}
.d-row.set{color:var(--blue)}.d-row.set.od{color:var(--red)}
.d-row .clr{display:none;color:var(--sub);padding:6px}.d-row.set .clr{display:flex}
.d-row select{flex:1;border:0;background:transparent;outline:0;color:inherit;min-width:0;cursor:pointer}
#dNotes{width:100%;border:0;outline:0;resize:vertical;min-height:110px;padding:12px;background:transparent;border-radius:4px}
#detailFoot{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;border-top:1px solid var(--line);color:var(--sub);font-size:12px}
#detailFoot .center{flex:1;text-align:center}
/* menus, modals, toasts */
.menu{position:fixed;z-index:100;background:#fff;box-shadow:0 6.4px 14.4px rgba(0,0,0,.13),0 1.2px 3.6px rgba(0,0,0,.11);border-radius:4px;min-width:220px;padding:6px 0;max-height:80vh;overflow:auto}
.menu .mi{display:flex;align-items:center;gap:12px;width:100%;padding:0 16px;height:36px;text-align:left}
.menu .mi:hover{background:#f3f2f1}
.menu .mi.danger{color:var(--red)}
.menu .mi .r{margin-left:auto;color:var(--sub);font-size:12px}
.menu .msep{height:1px;background:var(--line);margin:4px 0}
.menu .mhead{padding:6px 16px;font-size:12px;color:var(--sub);font-weight:600}
.menu .mform{padding:8px 16px;display:flex;flex-direction:column;gap:8px}
.menu .mform input,.menu .mform select{padding:6px;border:1px solid #c8c6c4;border-radius:2px}
.menu .days{display:flex;gap:4px}.menu .days label{display:flex;flex-direction:column;align-items:center;font-size:11px}
#overlay{position:fixed;inset:0;z-index:90}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:8px;box-shadow:0 25px 50px rgba(0,0,0,.25);width:100%;max-width:440px;max-height:90vh;overflow:auto;padding:22px 24px}
.modal h2{margin:0 0 6px;font-size:18px;font-weight:600}
.modal p{color:var(--sub);margin:4px 0 14px;line-height:1.45}
.modal .row-end{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.btn{height:32px;padding:0 16px;border-radius:4px;border:1px solid #8a8886;background:#fff;font-weight:600}
.btn:hover{background:#f3f2f1}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{background:var(--blue-d)}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.link{border:0;color:var(--blue);padding:0 4px;font-weight:400}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:13px;font-weight:600}
.field input,.field select{height:34px;padding:0 10px;border:1px solid #8a8886;border-radius:4px;outline:0;background:#fff}
.field input:focus{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.share-user{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.share-user input{width:18px;height:18px;accent-color:var(--blue);margin:0}
.share-user .nm{flex:1}
.share-user .tag{font-size:12px;color:var(--sub)}
.code{font-family:Consolas,monospace;font-size:18px;letter-spacing:2px;background:var(--blue-l);padding:6px 10px;border-radius:4px;display:inline-block;color:var(--blue-d)}
table.users{width:100%;border-collapse:collapse;font-size:13px}table.users td{padding:6px 4px;border-bottom:1px solid var(--line)}
.settings-sec{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}
.settings-sec h3{font-size:14px;margin:0 0 8px}
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:#323130;color:#fff;padding:10px 16px;border-radius:4px;box-shadow:var(--shadow);pointer-events:auto;display:flex;gap:12px;align-items:center}
.toast button{color:#9fd5ff;font-weight:600}
.toast.reminder{background:var(--blue)}
.drag-ghost{position:fixed;z-index:200;pointer-events:none;opacity:.9;box-shadow:0 8px 20px rgba(0,0,0,.25);transform:rotate(1deg)}
.task.dragging{opacity:.35}
/* auth */
#auth{position:fixed;inset:0;background:linear-gradient(160deg,#2564cf 0%,#5a8fe6 100%);display:flex;align-items:center;justify-content:center;padding:16px;z-index:70;overflow:auto}
#auth .modal{max-width:380px}
#auth .logo{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:22px;font-weight:600;color:var(--blue)}
#auth .logo img{width:40px;height:40px}
#auth .err{color:var(--red);min-height:18px;font-size:13px;margin:4px 0}
#auth .alt{margin-top:14px;font-size:13px;display:flex;flex-direction:column;gap:6px}
#scrim{display:none}
/* mobile */
@media (max-width:767px){
  #menuBtn{display:flex}
  #topbar .brand{padding:0 2px}
  #searchWrap{max-width:none}
  #syncChip .txt{display:none}
  #sidebar{position:fixed;top:calc(48px + env(safe-area-inset-top));bottom:0;left:0;z-index:40;transform:translateX(-100%);width:min(300px,85vw)}
  body.nav-open #sidebar{transform:none;box-shadow:0 0 20px rgba(0,0,0,.2)}
  body.nav-open #scrim{display:block;position:fixed;inset:0;top:48px;background:rgba(0,0,0,.35);z-index:35}
  #detail{position:fixed;inset:0;top:calc(48px + env(safe-area-inset-top));width:auto;z-index:45;transform:translateX(100%);transition:transform .2s;border:0}
  body.detail-open #detail{transform:none}
  #mainHead{padding:12px 12px 6px}
  #addBox{margin:4px 12px 8px}
  #taskArea{padding:0 12px 90px}
  .head-btn .t{display:none}
  .step .x{opacity:1}
  #detailScroll{padding-bottom:calc(16px + env(safe-area-inset-bottom))}
}
@media (min-width:768px){ #detail.closed{display:none} #detailBack{display:none} }
</style>
</head>
<body>
<div id="auth" class="hidden"><div class="modal" id="authCard"></div></div>
<div id="app" class="hidden">
  <header id="topbar">
    <button class="tb-btn" id="menuBtn" data-act="toggleNav" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    <div class="brand">Odmit</div>
    <label id="searchWrap"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/></svg><input id="search" type="search" placeholder="Search" autocomplete="off"></label>
    <div id="syncChip" title="Sync status"><span class="dot"></span><span class="txt">Synced</span></div>
    <button class="tb-btn" data-act="settings" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    <div class="avatar" id="meAvatar" data-act="settings" title=""></div>
  </header>
  <div id="shell">
    <nav id="sidebar"><div id="navScroll"></div>
      <div id="navFooter"><button data-act="newList"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New list</button>
        <button class="ng" data-act="newGroup" title="New group" aria-label="New group"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 10v6M9 13h6"/></svg></button></div>
    </nav>
    <div id="scrim" data-act="closeNav"></div>
    <main id="main">
      <div id="mainHead">
        <div class="titles"><input id="viewTitle" readonly aria-label="List name"><div id="viewSub"></div></div>
        <button class="head-btn" id="shareBtn" data-act="share"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M19 8v6M16 11h6"/></svg><span class="t">Share</span></button>
        <button class="head-btn" id="sortBtn" data-act="sortMenu"><svg viewBox="0 0 24 24"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/></svg><span class="t">Sort</span></button>
        <button class="head-btn" id="moreBtn" data-act="listMenu" aria-label="List options"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
      </div>
      <div id="addBox"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><input id="addInput" placeholder="Add a task" maxlength="500" autocomplete="off"><button id="addBtn" data-act="addTask" class="hidden">Add</button></div>
      <div id="taskArea"></div>
    </main>
    <aside id="detail" class="closed"></aside>
  </div>
</div>
<div id="toasts"></div>
<script>
'use strict';
/* =====================================================================  Odmit
   Set your Apps Script web app URL here (ends in /exec), or paste it on the sign-in screen. */
const DEFAULT_API_URL = '';
/* ===================================================================== */

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
const LS = {
  get(k, d) { try { const v = localStorage.getItem('odmit.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('odmit.' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('odmit.' + k); } catch (e) {} },
};
const IN_GAS = !!(window.google && google.script && google.script.run);
const qs = new URLSearchParams(location.search);
if (qs.get('api')) LS.set('api', qs.get('api'));
const apiUrl = () => LS.get('api', '') || DEFAULT_API_URL;

/* ---------- icons ---------- */
const IC = {
  sun: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  star: '<svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/></svg>',

/* ---------- dates ---------- */
const pad2 = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());

const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const today = () => ymd(new Date());
const tomorrow = () => ymd(addDays(new Date(), 1));
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
function dueLabel(s) {

  if (s === t) return 'Today';
  if (s === tomorrow()) return 'Tomorrow';

  const d = parseYmd(s), now = new Date();
  return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: d.getFullYear() !== now.getFullYear() ? 'numeric' : undefined });

}

    case 'weekdays': { let x = addDays(d, 1); while (x.getDay() === 0 || x.getDay() === 6) x = addDays(x, 1); return ymd(x); }

    case 'custom': {

      if (r.unit === 'month') return ymd(addMonths(d, n));
      if (r.unit === 'year') return ymd(addMonths(d, 12 * n));

}

function rawApi(body) {

/* ---------- task actions ---------- */
function addTask(title) {
  title = title.trim(); if (!title) return;
  const v = viewInfo();
  const listId = v.kind === 'list' ? v.id : (inbox() || {}).id;
  if (!listId) return toast('Still loading your lists, try again in a moment');
  const sameList = st.tasks.filter(t => t.listId === listId);
  const task = { id: uid('t_'), listId, title, order: sameList.length ? Math.min(...sameList.map(t => t.order || 0)) - 1000 : 0, createdAt: new Date().toISOString(), createdBy: me().id };
  if (v.id === 'myday') task.myDay = today();
  if (v.id === 'important') task.important = true;
  if (v.id === 'planned') task.dueDate = today();
  mutate({ type: 'task.create', task });
}
function toggleTask(id) {
  const t = st.tasks.find(x => x.id === id); if (!t) return;
  if (t.completed) return upd(id, { completed: false, completedAt: '' });
  const patch = { completed: true, completedAt: new Date().toISOString() };
  if (t.repeat) { // like Microsoft To Do: completing a repeating task creates the next one
    const due = nextDue(t.dueDate || today(), t.repeat);
    const nt = { id: uid('t_'), listId: t.listId, title: t.title, important: t.important, notes: t.notes, repeat: t.repeat, assignedTo: t.assignedTo,
      dueDate: due, steps: (t.steps || []).map(s => ({ id: uid('s'), title: s.title, done: false })), order: t.order, createdAt: new Date().toISOString(), createdBy: me().id };
    if (t.reminderAt) { const shift = parseYmd(due) - parseYmd(t.dueDate || today()); nt.reminderAt = new Date(new Date(t.reminderAt).getTime() + shift).toISOString(); }
    patch.repeat = null;
    upd(id, patch); mutate({ type: 'task.create', task: nt });
    return toast('Completed. Next one is due ' + dueLabel(due));
  }

}
async function deleteTask(id) {
  const t = st.tasks.find(x => x.id === id); if (!t) return;

}

/* ---------- menus / dialogs / toasts ---------- */
function closeMenu() { document.querySelectorAll('.menu,#overlay').forEach(e => e.remove()); }
function showMenu(anchor, items, opts) {
  closeMenu();
  const ov = document.createElement('div'); ov.id = 'overlay'; ov.onclick = closeMenu; document.body.appendChild(ov);
  const m = document.createElement('div'); m.className = 'menu'; m.setAttribute('role', 'menu');
  items.forEach(it => {
    if (it === '-') { m.insertAdjacentHTML('beforeend', '<div class="msep"></div>'); return; }
    if (it.head) { m.insertAdjacentHTML('beforeend', `<div class="mhead">${esc(it.head)}</div>`); return; }
    if (it.html) { const d = document.createElement('div'); d.innerHTML = it.html; m.appendChild(d); if (it.init) it.init(d); return; }
    const b = document.createElement('button'); b.className = 'mi' + (it.danger ? ' danger' : ''); b.setAttribute('role', 'menuitem');
    b.innerHTML = (it.icon ? IC[it.icon] : '') + `<span>${esc(it.label)}</span>` + (it.right ? `<span class="r">${esc(it.right)}</span>` : '') + (it.checked ? `<span class="r">${IC.check}</span>` : '');
    b.onclick = e => { e.stopPropagation(); if (!it.keepOpen) closeMenu(); it.fn && it.fn(); };
    m.appendChild(b);
  });
  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect(), mw = m.offsetWidth, mh = m.offsetHeight;
  let x = (opts && opts.alignRight) ? r.right - mw : r.left, y = r.bottom + 4;
  if (x + mw > innerWidth - 8) x = innerWidth - mw - 8; if (x < 8) x = 8;
  if (y + mh > innerHeight - 8) y = Math.max(8, r.top - mh - 4);
  m.style.left = x + 'px'; m.style.top = y + 'px';
  const f = m.querySelector('input,button'); if (f && !(opts && opts.noFocus)) f.focus();
  return m;
}
function openModal(html, onClose) {

  const b = document.createElement('div'); b.className = 'backdrop'; b.id = 'modalBack';
  b.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  b.addEventListener('mousedown', e => { if (e.target === b) closeModal(); });
  b._onClose = onClose;
  document.body.appendChild(b); return b.firstChild;
}
function closeModal() { const b = $('#modalBack'); if (b) { b.remove(); b._onClose && b._onClose(); } }
function confirmDialog(title, text, ok, danger) {
  return new Promise(res => {
    let done = false; const fin = v => { if (!done) { done = true; res(v); } };
    const m = openModal(`<h2>${esc(title)}</h2><p>${esc(text)}</p><div class="row-end"><button class="btn" data-x="0">Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" data-x="1">${esc(ok)}</button></div>`, () => fin(false));
    m.querySelectorAll('[data-x]').forEach(b => b.onclick = () => { fin(b.dataset.x === '1'); closeModal(); });
    m.querySelector('[data-x="1"]').focus();

}
function promptDialog(title, value, label) {

    const m = openModal(`<h2>${esc(title)}</h2><div class="field" style="margin-top:12px"><label>${esc(label)}</label><input id="pdIn" maxlength="60" value="${esc(value)}"></div>
      <div class="row-end"><button class="btn" data-x="0">Cancel</button><button class="btn primary" data-x="1">Save</button></div>`, () => fin(null));
    const inp = m.querySelector('#pdIn'); inp.focus(); inp.select();

/* ---------- reminders & notifications ---------- */
async function askNotify(explicit) {

}
async function notify(title, body, taskId) {

  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const opts = { body, icon: 'icons/icon-192.png', badge: 'icons/icon-192.png', tag: taskId || 'test', data: { taskId }, requireInteraction: true };
  try { // Android Chrome only allows notifications through the service worker
    const reg = navigator.serviceWorker && await Promise.race([navigator.serviceWorker.getRegistration(), new Promise(r => setTimeout(r, 1000))]);
    if (reg) return reg.showNotification(title, opts);
  } catch (e) {}
  try { new Notification(title, opts); } catch (e) {}
}
function checkReminders() {
  if (!st) return;
  const done = LS.get('notified', {}), now = Date.now();
  st.tasks.forEach(t => {
    if (!t.reminderAt || t.completed) return;
    const at = Date.parse(t.reminderAt), key = t.id + '@' + t.reminderAt;
    if (at <= now && !done[key]) {
      done[key] = now;
      if (now - at < 24 * 3600e3) notify(t.title, (t.dueDate ? 'Due ' + dueLabel(t.dueDate) + ' · ' : '') + (listOf(t) || {}).name, t.id);
    }
  });
  Object.keys(done).forEach(k => { if (now - done[k] > 30 * 864e5) delete done[k]; });
  LS.set('notified', done);
}
setInterval(checkReminders, 15000);

/* ---------- drag & drop (mouse: drag; touch: long-press then drag) ---------- */
let drag = null, dragJustEnded = false;

    if (dist < 6) return;

}

    }

}

    <div class="field"><label for="aPw2">Confirm password</label><input id="aPw2" type="password" autocomplete="new-password"></div>
    <div class="err">${esc(msg || '')}</div><div class="row-end"><button class="btn primary" id="aGo">Set password &amp; sign in</button></div>
    <div class="alt"><button class="btn link" data-m="login">I already have a password</button>${urlLink}</div>`;
  else c.innerHTML = logo + `<h2>Sign in</h2>
    <div class="field"><label for="aName">Name</label><input id="aName" autocomplete="username" maxlength="60"></div>
    <div class="field"><label for="aPw">Password</label><input id="aPw" type="password" autocomplete="current-password"></div>
    <div class="err">${esc(msg || '')}</div><div class="row-end"><button class="btn primary" id="aGo">Sign in</button></div>
    <div class="alt"><button class="btn link" data-m="claim">I have an invite code</button>${urlLink}</div>`;
  c.querySelectorAll('[data-m]').forEach(b => b.onclick = () => authCard(b.dataset.m));
  const go = $('#aGo'), val = id => (c.querySelector('#' + id) || {}).value || '';
  const err = m => { c.querySelector('.err').textContent = m; go.disabled = false; };
  c.querySelectorAll('input').forEach(i => i.onkeydown = e => { if (e.key === 'Enter') go.click(); });
  const f = c.querySelector('input'); if (f) f.focus();
  go.onclick = async () => {
    go.disabled = true;
    if (mode === 'url') { const u = val('aUrl').trim(); if (!/^https?:\/\//.test(u)) return err('That does not look like a URL'); LS.set('api', u); return start(); }
    if ((mode === 'setup' || mode === 'claim') && val('aPw') !== val('aPw2')) return err('Passwords do not match');
    const body = mode === 'setup' ? { action: 'setup', name: val('aName'), password: val('aPw') } : mode === 'claim' ? { action: 'claim', name: val('aName'), code: val('aCode'), password: val('aPw') } : { action: 'login', name: val('aName'), password: val('aPw') };
    try {
      const r = await rawApi(body);
      if (!r.ok) return err(r.error);
      signedIn(r);
    } catch (e) { err(e.message === 'NO_URL' ? 'Set the server URL first' : "Can't reach the server. Check your connection and the server URL."); }
  };
}
function signedIn(r) {
  session = { token: r.token, userId: r.me.id, name: r.me.name }; LS.set('session', session);
  delete r.token; delete r.ok; server = r;
  queue = LS.get('queue.' + session.userId, []); // keep changes made before a session expired
  rebuild(); saveLocal(); showApp(); if (queue.length) flush();
}
function signOut(expired) {
  if (!expired && session) { rawApi({ action: 'logout', token: session.token }).catch(() => {}); LS.del('server.' + session.userId); LS.del('queue.' + session.userId); LS.del('notified'); }
  session = null; server = null; st = null; queue = []; LS.del('session'); ui.selected = null;
  authCard('login', expired ? 'Please sign in again.' : '');
}
function showApp() {
  $('#auth').classList.add('hidden'); $('#app').classList.remove('hidden');
  if (qs.get('view')) ui.view = qs.get('view');
  render(); checkReminders();
  if (qs.get('task')) openTask(qs.get('task'));
}
async function start() {
  if (session) { loadLocal(); showApp(); flush(); return; }
  if (!IN_GAS && !apiUrl()) return authCard('url');
  try { const r = await rawApi({ action: 'status' }); authCard(r.needsSetup ? 'setup' : 'login'); }
  catch (e) { authCard(IN_GAS ? 'login' : 'url', "Can't reach the server. Check the URL and your connection."); }
}
if ('serviceWorker' in navigator && !IN_GAS && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
start();
</script>
</body>
